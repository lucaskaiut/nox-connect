server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Uploads
    client_max_body_size 100M;
    client_body_buffer_size 512k;

    # Headers básicos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP permissiva para SPA + Vite dev; ajuste connect-src/img-src conforme integrações.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS: habilitar apenas quando TLS termina aqui ou no proxy de borda em produção.
    # Em dev (HTTP :80 atrás de proxy), o proxy de produção deve enviar Strict-Transport-Security.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Desenvolvimento: evita cache agressivo de arquivos em bind mounts
    sendfile off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Healthcheck do próprio Nginx (não passa pelo PHP)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }

    # Reverb WebSocket
    location /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
        proxy_pass http://reverb:8080;
    }

    # Bloqueia dotfiles (exceto .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
